# nadicode fork only: builds the wheels with pg0's own workflow and publishes
# them as a GitHub release of this fork. Tags must not start with "v", which
# would start the upstream Release workflow (PyPI publishing).
name: nadicode release

on:
  push:
    tags:
      - '*-nadicode.*'

permissions:
  contents: write

jobs:
  wheels:
    uses: ./.github/workflows/build-python-wheels.yml

  release:
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes "pg0-embedded 0.15.2 with OpenSSL bundled in the macOS PostgreSQL build, so it starts on a Mac without Homebrew (fix/macos-portable-openssl)."
